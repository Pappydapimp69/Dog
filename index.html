<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Dog Park 3D 🐕</title>
  <link rel="stylesheet" href="world.css" />
</head>
<body>
  <div id="app">
    <canvas id="scene"></canvas>

    <!-- HUD -->
    <div id="hud">
      <div class="badge">🦴 Bones <b id="bones">0</b></div>
      <div class="badge">🥏 Frisbees <b id="frisbees">0</b></div>
    </div>
    <button id="sound-toggle" title="Toggle sound (M)">🔊</button>

    <!-- Mobile controls -->
    <div id="touch-controls" class="hidden">
      <div id="joystick"><div id="stick"></div></div>
      <button id="bark-btn">BARK</button>
      <button id="jump-btn">JUMP</button>
    </div>

    <!-- Start / help overlay -->
    <div id="overlay">
      <div class="card">
        <h1>Dog Park 3D 🐕</h1>
        <p>Walk around an open park as a good dog. Sniff out <b>🦴 bones</b> and
           <b>🥏 frisbees</b> scattered across the grass.</p>
        <div class="keys">
          <span><b>W A S D</b> / arrows — walk</span>
          <span><b>Mouse drag</b> — look around</span>
          <span><b>Shift</b> — run · <b>Space</b> — jump · <b>B</b> — bark</span>
          <span>📱 left stick to move, drag right to look</span>
        </div>
        <button id="start-btn">Enter the Park</button>
        <p class="loading" id="loading">Loading world…</p>
      </div>
    </div>
  </div>

  <script type="module" src="world.js"></script>
</body>
</html>
