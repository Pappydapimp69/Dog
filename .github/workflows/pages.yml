name: Deploy to GitHub Pages

on:
  push:
    branches: ["claude/dog-game-continue-oc3xqh"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, don't cancel in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Turn on Pages (GitHub Actions source) automatically on first run.
          enablement: true

      # Stamp a unique build id so every deploy busts the browser/module cache.
      - name: Stamp build id
        run: |
          BID="${GITHUB_SHA::7}"
          sed -i "s/__BUILD__/$BID/g" index.html *.js smallmouth/index.html smallmouth/sim/*.js
          echo "Stamped build $BID"

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
